# Redis Sentinel Configuration for High Availability Redis Cluster
# This configuration monitors all Redis instances for automatic failover

# Basic Configuration
port 26379
dir /tmp

# Monitor Redis Queue (Primary - most critical)
sentinel monitor redis-queue redis_queue 6379 2
sentinel down-after-milliseconds redis-queue 5000
sentinel failover-timeout redis-queue 60000
sentinel parallel-syncs redis-queue 1

# Monitor Redis Cache
sentinel monitor redis-cache redis_cache 6379 2
sentinel down-after-milliseconds redis-cache 5000
sentinel failover-timeout redis-cache 60000
sentinel parallel-syncs redis-cache 1

# Monitor Redis State
sentinel monitor redis-state redis_state 6379 2
sentinel down-after-milliseconds redis-state 5000
sentinel failover-timeout redis-state 60000
sentinel parallel-syncs redis-state 1

# Monitor Redis Analytics
sentinel monitor redis-analytics redis_analytics 6379 2
sentinel down-after-milliseconds redis-analytics 5000
sentinel failover-timeout redis-analytics 60000
sentinel parallel-syncs redis-analytics 1

# Sentinel Configuration
sentinel deny-scripts-reconfig yes
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Logging
logfile ""
loglevel notice

# Security (in production, use authentication)
# sentinel auth-pass redis-queue your_redis_password
# sentinel auth-pass redis-cache your_redis_password
# sentinel auth-pass redis-state your_redis_password
# sentinel auth-pass redis-analytics your_redis_password 