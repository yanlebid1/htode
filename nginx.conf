user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers (applied to all server blocks)
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SSL configuration (shared across all HTTPS server blocks)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (enable when using a public CA)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webapp:10m rate=20r/s;

    # Upstream definitions for load balancing

    # Mini WebApp Load Balancing (3 replicas)
    upstream webapp_backend {
        least_conn;  # Load balancing method
        server mini_webapp_1:8080 max_fails=3 fail_timeout=30s;
        server mini_webapp_2:8080 max_fails=3 fail_timeout=30s;
        server mini_webapp_3:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Camoufox Services Load Balancing (3 replicas)
    upstream camoufox_backend {
        least_conn;
        server camoufox_service_1:8100 max_fails=3 fail_timeout=30s;
        server camoufox_service_2:8100 max_fails=3 fail_timeout=30s;
        server camoufox_service_3:8100 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # WebCrawler Services Load Balancing (3 replicas)
    upstream webcrawler_backend {
        least_conn;
        server webcrawler_service_1:8200 max_fails=3 fail_timeout=30s;
        server webcrawler_service_2:8200 max_fails=3 fail_timeout=30s;
        server webcrawler_service_3:8200 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect for WebApp ──────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health check stays on HTTP (for Docker healthcheck / internal probes)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS WebApp Server ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name webapp.local localhost;

        # HSTS (tell browsers to always use HTTPS)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Rate limiting for webapp
        location / {
            limit_req zone=webapp burst=20 nodelay;

            proxy_pass http://webapp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Connection settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Health checks
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # WebApp health check
        location /health {
            access_log off;
            proxy_pass http://webapp_backend/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }
    }

    # ── HTTPS Browser Automation API Server ───────────────────────────────
    server {
        listen 8143 ssl;
        http2 on;
        server_name camoufox.local localhost;

        # Rate limiting for browser API
        location / {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://camoufox_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Longer timeouts for browser operations
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Large body support for browser content
            client_max_body_size 100M;

            # Health checks
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
        }

        # Browser service health and stats
        location ~ ^/(health|stats)$ {
            access_log off;
            proxy_pass http://camoufox_backend;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }

    # ── HTTPS WebCrawler API Server ───────────────────────────────────────
    server {
        listen 8243 ssl;
        http2 on;
        server_name webcrawler.local localhost;

        location / {
            limit_req zone=api burst=15 nodelay;

            proxy_pass http://webcrawler_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Medium timeouts for crawling
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Health checks
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;
        }

        # WebCrawler health check
        location /health {
            access_log off;
            proxy_pass http://webcrawler_backend/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }
    }

    # ── Load Balancer Status and Monitoring (internal only, no SSL) ───────
    server {
        listen 8888;
        server_name monitor.local localhost;

        # Nginx status page
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # Upstream status (custom endpoint)
        location /upstreams {
            access_log off;
            return 200 '{"webapp_backend": "3 servers", "camoufox_backend": "3 servers", "webcrawler_backend": "3 servers"}';
            add_header Content-Type application/json;
        }

        # Load balancer health check
        location /health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
