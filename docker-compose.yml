version: '3.8'

# Define common environment variables for reuse
x-common-variables: &common-variables
  REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  DB_HOST: "${DB_HOST:-postgres}"
  DB_PORT: "${DB_PORT:-5432}"
  DB_NAME: "${DB_NAME:-mydb}"
  DB_USER: "${DB_USER:-myuser}"
  DB_PASS: "${DB_PASS:-mypass}"

# Define common AWS environment variables
x-aws-variables: &aws-variables
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-1}"
  AWS_S3_BUCKET: "${AWS_S3_BUCKET:-htodebucket}"
  AWS_S3_BUCKET_PREFIX: "${AWS_S3_BUCKET_PREFIX:-ads-images/}"
  CLOUDFRONT_DOMAIN: "${CLOUDFRONT_DOMAIN:-https://d3h86hbbdu2c7h.cloudfront.net}"

# Combined environment variables
x-combined-env: &combined-env
  REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  DB_HOST: "${DB_HOST:-postgres}"
  DB_PORT: "${DB_PORT:-5432}"
  DB_NAME: "${DB_NAME:-mydb}"
  DB_USER: "${DB_USER:-myuser}"
  DB_PASS: "${DB_PASS:-mypass}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-1}"
  AWS_S3_BUCKET: "${AWS_S3_BUCKET:-htodebucket}"
  AWS_S3_BUCKET_PREFIX: "${AWS_S3_BUCKET_PREFIX:-ads-images/}"
  CLOUDFRONT_DOMAIN: "${CLOUDFRONT_DOMAIN:-https://d3h86hbbdu2c7h.cloudfront.net}"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Define resource limits for services with Playwright
x-playwright-resource-limits: &playwright-resource-limits
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1G
      reservations:
        cpus: '0.5'
        memory: 512M

# Define common service settings
x-service-settings: &service-settings
  networks:
    - app_net
  restart: unless-stopped

# Define resource limits for services
x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 256M

# Define resource limits for smaller services
x-small-resource-limits: &small-resource-limits
  deploy:
    resources:
      limits:
        cpus: '0.30'
        memory: 256M
      reservations:
        cpus: '0.10'
        memory: 128M

# Define combined settings for reuse
x-combined-settings: &combined-settings
  networks:
    - app_net
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 256M

# Define combined small settings
x-combined-small-settings: &combined-small-settings
  networks:
    - app_net
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '0.30'
        memory: 256M
      reservations:
        cpus: '0.10'
        memory: 128M

# Define combined playwright settings
x-combined-playwright-settings: &combined-playwright-settings
  networks:
    - app_net
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1G
      reservations:
        cpus: '0.5'
        memory: 512M

services:
  redis:
    image: redis:7
    container_name: my_redis
    <<: *combined-settings
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5
    command: [ "redis-server", "--appendonly", "yes" ]

  postgres:
    image: postgres:14
    container_name: my_postgres
    <<: *combined-settings
    environment:
      POSTGRES_DB: "${DB_NAME:-mydb}"
      POSTGRES_USER: "${DB_USER:-myuser}"
      POSTGRES_PASSWORD: "${DB_PASS:-mypass}"
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "postgres" ]
      interval: 5s
      timeout: 2s
      retries: 5

  telegram_service:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: telegram_service
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/telegram_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-variables
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      SERVICE_NAME: "telegram"
      PYTHONPATH: "/app"  # Simplified PYTHONPATH
      WEBAPP_URL: "${WEBAPP_URL}"
    command: python -m services.telegram_service.app.main  # Updated command path

  telegram_worker_service:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: telegram_worker
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/telegram_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-variables
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      PYTHONPATH: "/app"  # Simplified PYTHONPATH
      WEBAPP_URL: "${WEBAPP_URL}"
    command: celery -A services.telegram_service.app.celery_app worker -Q telegram_queue --loglevel=info --concurrency=2 --max-tasks-per-child=100
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-d", "celery@telegram_worker" ]
      interval: 30s
      timeout: 10s
      retries: 3

  viber_service:
    env_file:
      - .env
    container_name: viber_service
    networks:
      - app_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    build:
      context: .
      dockerfile: services/viber_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-variables
      VIBER_TOKEN: "${VIBER_TOKEN}"
      VIBER_WEBHOOK_URL: "${VIBER_WEBHOOK_URL}"
      SERVICE_NAME: "viber"
    ports:
      - "8001:8000"  # Expose port for webhook
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3


  viber_worker_service:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: viber_worker
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/viber_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-variables
      VIBER_TOKEN: "${VIBER_TOKEN}"
      VIBER_WEBHOOK_URL: "${VIBER_WEBHOOK_URL}"
      PYTHONPATH: "/app"
    command: celery -A services.viber_service.app.celery_app.celery_app worker -Q viber_queue --loglevel=info --concurrency=2 --max-tasks-per-child=100
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-d", "celery@viber_worker" ]
      interval: 30s
      timeout: 10s
      retries: 3


  whatsapp_service:
    env_file:
      - .env
    container_name: whatsapp_service
    networks:
      - app_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    build:
      context: .
      dockerfile: services/whatsapp_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8002:8080"  # Expose port for webhook
    environment:
      <<: *common-variables
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
      SERVICE_NAME: "whatsapp"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3


  whatsapp_worker_service:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: whatsapp_worker
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/whatsapp_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-variables
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
      PYTHONPATH: "/app"
    command: celery -A services.whatsapp_service.app.celery_app.celery_app worker -Q whatsapp_queue --loglevel=info --concurrency=2 --max-tasks-per-child=100
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-d", "celery@whatsapp_worker" ]
      interval: 30s
      timeout: 10s
      retries: 3

  scraper_worker_service:
    container_name: scraper_worker_service
    <<: *combined-playwright-settings
    build:
      context: .
      dockerfile: services/scraper_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging: *default-logging
    environment:
      <<: *combined-env
      DISABLE_CAMOUFOX: "1"
    command: celery -A scraper_service.app.celery_app worker --loglevel=info -Q scrape_queue --max-tasks-per-child=50
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-d", "celery@scraper_worker_service" ]
      interval: 30s
      timeout: 10s
      retries: 3

  scraper_beat_service:
    container_name: scraper_beat_service
    <<: *combined-small-settings
    build:
      context: .
      dockerfile: services/scraper_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *combined-env
    command: celery -A scraper_service.app.celery_app beat --loglevel=info

  scraper_init_service:
    container_name: scraper_init_service
    build:
      context: .
      dockerfile: services/scraper_service/Dockerfile
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      scraper_worker_service:
        condition: service_started
    environment:
      <<: *combined-env
    networks:
      - app_net
    command: >
      sh -c "
        echo 'Waiting for postgres to be ready...';
        until pg_isready -h postgres -p 5432 -U $${DB_USER}; do
          sleep 1;
        done;
        echo 'Postgres is ready. Triggering initial data scrape...';
        celery -A scraper_service.app.celery_app call scraper_service.app.tasks.initial_30_day_scrape;
        echo 'Initial data scrape task triggered. Exiting.';
      "
    restart: "no"

  notifier_service:
    container_name: notifier_service
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/notifier_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *combined-env
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    command: celery -A app.celery_app worker --loglevel=info -Q notify_queue
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-d", "celery@notifier_service" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mini_webapp_service:
    container_name: mini_webapp
    <<: *combined-small-settings
    build:
      context: services/webapps
      dockerfile: Dockerfile
    volumes:
      - ./services/webapps:/app
      - ./common:/app/common
    ports:
      - "8080:8080"
    environment:
      <<: *common-variables
    command: uvicorn mini_webapp:app --host 0.0.0.0 --port 8080
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3


  maintenance_worker_service:
    container_name: maintenance_worker
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/scraper_service/Dockerfile  # Reuse scraper Dockerfile as it has similar dependencies
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *combined-env
    volumes:
      - ./common:/app/common
      - ./system:/app/system  # Mount the new maintenance module
    command: celery -A common.celery_app worker --loglevel=info -Q maintenance_queue --max-tasks-per-child=50
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-d", "celery@maintenance_worker" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app_net:
    driver: bridge

volumes:
  postgres-data:
  redis-data: