services:
  # NGINX LOAD BALANCER - Horizontal service scaling
  nginx_loadbalancer:
    image: nginx:alpine
    container_name: nginx_loadbalancer
    ports:
      - "80:80"          # WebApp load balanced
      - "8888:8888"      # Nginx monitoring
      - "9100:8100"      # Camoufox load balanced (external port 9100)
      - "9200:8200"      # WebCrawler load balanced (external port 9200)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - mini_webapp_1
      - mini_webapp_2
      - mini_webapp_3
      - camoufox_service_1
      - camoufox_service_2
      - camoufox_service_3
      - webcrawler_service_1
      - webcrawler_service_2
      - webcrawler_service_3
    networks:
      - app_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # REDIS CLUSTER SETUP - Functional separation for scaling
  
  # Primary Redis for Celery queues (high throughput, persistent)
  redis_queue:
    image: redis:7
    container_name: redis_queue
    ports:
      - "6379:6379"
    volumes:
      - redis-queue-data:/data
    environment:
      REDIS_MAXMEMORY: "${REDIS_QUEUE_MAXMEMORY:-2g}"
      REDIS_MAXMEMORY_POLICY: "allkeys-lru"
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme_in_production}
      --maxmemory ${REDIS_QUEUE_MAXMEMORY:-2g}
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --tcp-backlog 511
      --databases 16
      --maxclients 10000
      --hz 10
      --save 900 1
      --save 300 10
      --save 60 10000
    deploy:
      resources:
        limits:
          cpus: '2.0'              # Increased from 0.5
          memory: 3G               # Increased from 512M
        reservations:
          cpus: '1.0'
          memory: 1.5G
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  # Redis for application caching (fast access, can lose data)
  redis_cache:
    image: redis:7
    container_name: redis_cache
    ports:
      - "6380:6379"
    volumes:
      - redis-cache-data:/data
    environment:
      REDIS_MAXMEMORY: "${REDIS_CACHE_MAXMEMORY:-1g}"
      REDIS_MAXMEMORY_POLICY: "allkeys-lru"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_in_production}
      --maxmemory ${REDIS_CACHE_MAXMEMORY:-1g}
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --maxclients 5000
      --hz 10
      --save ""
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.75'
          memory: 1G
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5

  # Redis for user states and sessions (persistent, smaller dataset)
  redis_state:
    image: redis:7
    container_name: redis_state
    ports:
      - "6381:6379"
    volumes:
      - redis-state-data:/data
    environment:
      REDIS_MAXMEMORY: "${REDIS_STATE_MAXMEMORY:-512m}"
      REDIS_MAXMEMORY_POLICY: "noeviction"
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme_in_production}
      --maxmemory ${REDIS_STATE_MAXMEMORY:-512m}
      --maxmemory-policy noeviction
      --tcp-keepalive 60
      --timeout 300
      --maxclients 5000
      --hz 10
      --save 900 1
      --save 300 10
      --save 60 1000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5

  # Redis for analytics and monitoring (can lose some data, high write load)
  redis_analytics:
    image: redis:7
    container_name: redis_analytics
    ports:
      - "6382:6379"
    volumes:
      - redis-analytics-data:/data
    environment:
      REDIS_MAXMEMORY: "${REDIS_ANALYTICS_MAXMEMORY:-512m}"
      REDIS_MAXMEMORY_POLICY: "allkeys-lru"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_in_production}
      --maxmemory ${REDIS_ANALYTICS_MAXMEMORY:-512m}
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --maxclients 3000
      --hz 10
      --save 900 1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5

  # Redis Sentinel for high availability (monitors all Redis instances)
  redis_sentinel_1:
    image: redis:7
    container_name: redis_sentinel_1
    ports:
      - "26379:26379"
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis_queue
      - redis_cache
      - redis_state
      - redis_analytics
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "26379", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  redis_sentinel_2:
    image: redis:7
    container_name: redis_sentinel_2
    ports:
      - "26380:26379"
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis_queue
      - redis_cache
      - redis_state
      - redis_analytics
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "26379", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  redis_sentinel_3:
    image: redis:7
    container_name: redis_sentinel_3
    ports:
      - "26381:26379"
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis_queue
      - redis_cache
      - redis_state
      - redis_analytics
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "26379", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # Legacy Redis alias for backward compatibility during migration
  redis:
    image: redis:7
    container_name: my_redis_legacy
    ports:
      - "6383:6379"
    volumes:
      - redis-legacy-data:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 2s
      retries: 5

  postgres:
    image: postgres:14
    container_name: my_postgres
    <<: *combined-settings
    environment:
      POSTGRES_DB: "${DB_NAME:-mydb}"
      POSTGRES_USER: "${DB_USER:-myuser}"
      POSTGRES_PASSWORD: "${DB_PASS:?DB_PASS must be set in .env}"
      # Optimized PostgreSQL settings for high concurrency
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "postgres" ]
      interval: 5s
      timeout: 2s
      retries: 5

  # PGBOUNCER CONNECTION POOLER - Consolidates DB connections from all containers
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: pgbouncer
    environment:
      DATABASE_URL: "postgres://${DB_USER:-myuser}:${DB_PASS}@postgres:5432/${DB_NAME:-mydb}"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 40
      MAX_CLIENT_CONN: 1000
      MAX_DB_CONNECTIONS: 200
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_RESET_QUERY: "DISCARD ALL"
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # TELEGRAM SERVICES - Horizontal scaling with multiple replicas
  telegram_service_1:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: telegram_service_1
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/telegram_service/Dockerfile
    depends_on:
      redis_queue:
        condition: service_healthy
      redis_state:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      <<: *common-variables
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      SERVICE_NAME: "telegram_1"
      SERVICE_REPLICA: "1"
      PYTHONPATH: "/app"  # Simplified PYTHONPATH
      WEBAPP_URL: "${WEBAPP_URL}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: python -m services.telegram_service.app.main  # Updated command path

  telegram_service_2:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: telegram_service_2
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/telegram_service/Dockerfile
    depends_on:
      redis_queue:
        condition: service_healthy
      redis_state:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      <<: *common-variables
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      SERVICE_NAME: "telegram_2"
      SERVICE_REPLICA: "2"
      PYTHONPATH: "/app"  # Simplified PYTHONPATH
      WEBAPP_URL: "${WEBAPP_URL}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: python -m services.telegram_service.app.main  # Updated command path

  telegram_service_3:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: telegram_service_3
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/telegram_service/Dockerfile
    depends_on:
      redis_queue:
        condition: service_healthy
      redis_state:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      <<: *common-variables
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      SERVICE_NAME: "telegram_3"
      SERVICE_REPLICA: "3"
      PYTHONPATH: "/app"  # Simplified PYTHONPATH
      WEBAPP_URL: "${WEBAPP_URL}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: python -m services.telegram_service.app.main  # Updated command path

  # TELEGRAM WORKERS - Multiple worker replicas for high throughput
  telegram_worker_1:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: telegram_worker_1
    build:
      context: .
      dockerfile: services/telegram_service/Dockerfile
    depends_on:
      redis_queue:
        condition: service_healthy
      redis_state:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      <<: *common-variables
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      SERVICE_REPLICA: "1"
      PYTHONPATH: "/app"  # Simplified PYTHONPATH
      WEBAPP_URL: "${WEBAPP_URL}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - app_net
    restart: unless-stopped
    command: celery -A services.telegram_service.app.celery_app worker -Q telegram_queue --loglevel=info --concurrency=8 --max-tasks-per-child=1000 -n telegram_worker_1@%h
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-d", "telegram_worker_1@telegram_worker_1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram_worker_2:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: telegram_worker_2
    build:
      context: .
      dockerfile: services/telegram_service/Dockerfile
    depends_on:
      redis_queue:
        condition: service_healthy
      redis_state:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      <<: *common-variables
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      SERVICE_REPLICA: "2"
      PYTHONPATH: "/app"  # Simplified PYTHONPATH
      WEBAPP_URL: "${WEBAPP_URL}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - app_net
    restart: unless-stopped
    command: celery -A services.telegram_service.app.celery_app worker -Q telegram_queue --loglevel=info --concurrency=8 --max-tasks-per-child=1000 -n telegram_worker_2@%h
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-d", "telegram_worker_2@telegram_worker_2" ]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram_worker_3:
    volumes:
      - ./services:/app/services  # Mount entire services directory
      - ./common:/app/common
    env_file:
      - .env
    container_name: telegram_worker_3
    build:
      context: .
      dockerfile: services/telegram_service/Dockerfile
    depends_on:
      redis_queue:
        condition: service_healthy
      redis_state:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      <<: *common-variables
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      SERVICE_REPLICA: "3"
      PYTHONPATH: "/app"  # Simplified PYTHONPATH
      WEBAPP_URL: "${WEBAPP_URL}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - app_net
    restart: unless-stopped
    command: celery -A services.telegram_service.app.celery_app worker -Q telegram_queue --loglevel=info --concurrency=8 --max-tasks-per-child=1000 -n telegram_worker_3@%h
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-d", "telegram_worker_3@telegram_worker_3" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # SCRAPER WORKERS - Multiple replicas for parallel scraping
  scraper_worker_1:
    container_name: scraper_worker_1
    <<: *combined-settings
    build:
      context: .
      dockerfile: services/scraper_service/Dockerfile
    depends_on:
      redis_queue:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      postgres:
        condition: service_healthy
