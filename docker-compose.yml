version: '3.8'

# Define common environment variables for reuse
x-common-variables: &common-variables
  REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0}"
  DB_HOST: "${DB_HOST:-postgres}"
  DB_PORT: "${DB_PORT:-5432}"
  DB_NAME: "${DB_NAME:-mydb}"
  DB_USER: "${DB_USER:-myuser}"
  DB_PASS: "${DB_PASS:?DB_PASS must be set in .env}"

# Define common AWS environment variables
x-aws-variables: &aws-variables
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-1}"
  AWS_S3_BUCKET: "${AWS_S3_BUCKET:-htodebucket}"
  AWS_S3_BUCKET_PREFIX: "${AWS_S3_BUCKET_PREFIX:-ads-images/}"
  CLOUDFRONT_DOMAIN: "${CLOUDFRONT_DOMAIN:-https://d3h86hbbdu2c7h.cloudfront.net}"

# Combined environment variables - Redis Cluster Configuration
x-combined-env: &combined-env
  # Redis Cluster URLs for functional separation (with auth)
  REDIS_QUEUE_URL: "${REDIS_QUEUE_URL:-redis://:${REDIS_PASSWORD:-changeme_in_production}@redis_queue:6379/0}"
  REDIS_CACHE_URL: "${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD:-changeme_in_production}@redis_cache:6379/0}"
  REDIS_STATE_URL: "${REDIS_STATE_URL:-redis://:${REDIS_PASSWORD:-changeme_in_production}@redis_state:6379/0}"
  REDIS_ANALYTICS_URL: "${REDIS_ANALYTICS_URL:-redis://:${REDIS_PASSWORD:-changeme_in_production}@redis_analytics:6379/0}"
  # Legacy Redis URL for backward compatibility
  REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme_in_production}@redis_queue:6379/0}"
  # Redis Sentinel URLs for high availability
  REDIS_SENTINELS: "${REDIS_SENTINELS:-redis_sentinel_1:26379,redis_sentinel_2:26379,redis_sentinel_3:26379}"
  # Database Configuration (routed through PgBouncer)
  DB_HOST: "${DB_HOST:-postgres}"
  DB_PORT: "${DB_PORT:-5432}"
  DB_NAME: "${DB_NAME:-mydb}"
  DB_USER: "${DB_USER:-myuser}"
  DB_PASS: "${DB_PASS:?DB_PASS must be set in .env}"
  DB_PGBOUNCER_HOST: "pgbouncer"
  # AWS Configuration
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-1}"
  AWS_S3_BUCKET: "${AWS_S3_BUCKET:-htodebucket}"
  AWS_S3_BUCKET_PREFIX: "${AWS_S3_BUCKET_PREFIX:-ads-images/}"
  CLOUDFRONT_DOMAIN: "${CLOUDFRONT_DOMAIN:-https://d3h86hbbdu2c7h.cloudfront.net}"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

