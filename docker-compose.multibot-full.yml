# ===== DEPLOYMENT NOTES =====
# To start all flower bots:
# docker-compose -f docker-compose.multibot-full.yml up -d
#
# To start specific flowers:
# docker-compose -f docker-compose.multibot-full.yml up -d \
#   dispatcher_bot \
#   pool_bot_orchid pool_bot_tulip pool_bot_daisy \
#   pool_bot_worker_orchid pool_bot_worker_tulip pool_bot_worker_daisy
#
# To scale gradually:
# docker-compose -f docker-compose.multibot-full.yml up -d --scale pool_bot_orchid=2
