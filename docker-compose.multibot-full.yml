version: '3.8'

# Complete Multi-Bot Architecture - All 20 Flower Bots 🌸
# This file includes the dispatcher bot and all 20 pool bots

services:
  # ===== DISPATCHER BOT =====
  dispatcher_bot:
    build:
      context: .
      dockerfile: services/dispatcher_service/Dockerfile
    container_name: dispatcher_bot
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - TELEGRAM_DISPATCHER_TOKEN=${TELEGRAM_DISPATCHER_TOKEN}
      - TELEGRAM_DISPATCHER_USERNAME=${TELEGRAM_DISPATCHER_USERNAME}
      - DB_HOST=postgres
      - REDIS_URL=redis://redis_queue:6379/0
      - REDIS_STATE_URL=redis://redis_state:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis_queue:
        condition: service_healthy
      redis_state:
        condition: service_healthy
    networks:
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ===== FLOWER BOT POOL =====
  # Each flower bot runs independently with its own token

  pool_bot_orchid:
    build:
      context: .
      dockerfile: services/pool_bot_service/Dockerfile
    container_name: pool_bot_orchid
