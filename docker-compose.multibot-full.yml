      - .env
    environment:
      - PYTHONPATH=/app
      - BOT_NAME=orchid
      - BOT_TOKEN=${BOT_POOL_1_TOKEN}
      - BOT_USERNAME=${BOT_POOL_1_USERNAME}
      - DB_HOST=postgres
